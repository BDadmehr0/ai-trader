<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI BTC Trader{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">₿</span>
      <span>AI BTC Trader</span>
      <span class="pair">{{ symbol|default(default_symbol) }}</span>
    </div>
    <div class="coin-search" id="coinSearch">
      <input
        class="coin-input"
        id="coinInput"
        type="text"
        placeholder="جستجوی رمزارز…"
        autocomplete="off"
        spellcheck="false"
      >
      <button class="coin-clear" id="coinClear" type="button" aria-label="پاک کردن" title="پاک کردن">×</button>
      <div class="coin-dropdown" id="coinDropdown" hidden>
        <div class="coin-list-head" id="popularHead">پرمعامله‌ترین</div>
        <ul class="coin-list" id="coinList"></ul>
      </div>
    </div>
    <nav class="nav">
      <a href="/" class="{{ 'active' if request.path == '/' else '' }}">سیگنال لحظه‌ای</a>
      <a href="/backtest" class="{{ 'active' if request.path == '/backtest' else '' }}">بک‌تست</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    این سیستم فقط تحلیل تکنیکال ارائه می‌دهد و تضمین سوددهی ندارد.
  </footer>
  <script>window.AI_TRADER_COINS = {{ coins | tojson }};</script>
  <script src="{{ url_for('static', filename='coinswitcher.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
